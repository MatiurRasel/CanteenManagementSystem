name: build

on:
  push:
    branches: [main, master, changing-all]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CanteenManagementSystem.sln

      - name: Build
        run: dotnet build CanteenManagementSystem.sln -c ${{ matrix.configuration }} --no-restore /warnaserror

      - name: Test
        run: dotnet test CanteenManagementSystem.sln -c ${{ matrix.configuration }} --no-build --logger "trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*'

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: canteen:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
