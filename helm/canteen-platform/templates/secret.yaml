apiVersion: v1
kind: Secret
metadata:
  name: {{ include "canteen.fullname" . }}-secrets
  labels:
    {{- include "canteen.labels" . | nindent 4 }}
type: Opaque
stringData:
  Auth__SigningKey: {{ required "secrets.authSigningKey is required (openssl rand -base64 48)" .Values.secrets.authSigningKey | quote }}
  ConnectionStrings__DefaultConnection: {{ required "secrets.connectionString is required" .Values.secrets.connectionString | quote }}
  {{- if .Values.secrets.redisConnectionString }}
  ConnectionStrings__Redis: {{ .Values.secrets.redisConnectionString | quote }}
  {{- end }}
