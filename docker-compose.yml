# Local dev compose: app + SQL Server + Redis + Jaeger for traces.
# Run: docker compose up -d
# Visit: http://localhost:8080/swagger and http://localhost:16686 (Jaeger UI)

services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=Canteen;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "cache:6379"
      Observability__OtlpEndpoint: "http://otel-collector:4317"
      Observability__ServiceName: "canteen-management"
    depends_on: [db, cache]
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports: ["1433:1433"]
    volumes: [ "mssql_data:/var/opt/mssql" ]

  cache:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [ "redis_data:/data" ]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    ports: ["4317:4317", "4318:4318"]

  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports: ["16686:16686", "14250:14250"]

volumes:
  mssql_data:
  redis_data:
